name: debug

on:
  push:
  pull_request:
  pull_request_target:
    types:
    - assigned
    - auto_merge_disabled
    - auto_merge_enabled
    - closed
    - converted_to_draft
    - demilestoned
    - dequeued
    - edited
    - enqueued
    - labeled
    - locked
    - milestoned
    - opened
    - ready_for_review
    - reopened
    - review_request_removed
    - review_requested
    - synchronize
    - unassigned
    - unlabeled
    - unlocked
  issue_comment:
  workflow_dispatch:

jobs:
  debug:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
    - name: debug
      env:
        github_json: ${{ toJSON(github) }}
        runner_json: ${{ toJSON(runner) }}
        pull_request_base_sha: ${{ github.event.pull_request.base.sha }}
        has_pull_requests: ${{ github.repository.has_pull_requests }}
      run: |
        wrap() {
        (
          echo "<details><summary>$1</summary>"
          echo
          echo '```'
          cat -
          echo
          echo '```'
          echo '</details>'
          echo
        ) >> "$GITHUB_STEP_SUMMARY"
        }
        env -0 | sort -z | tr '\0' '\n' | wrap env
        cat "$GITHUB_EVENT_PATH" | wrap event-file
        echo "$github_json" | wrap github
        echo "$runner_json" | wrap runner
        echo "$pull_request_base_sha" | wrap pull_request.base.sha
        echo "$has_pull_requests" | wrap repository.has_pull_requests
        (jq .repository.has_pull_requests "$GITHUB_EVENT_PATH" || true) | wrap jq-has_pull_requests

